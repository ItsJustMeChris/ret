# Serves getret.app. TLS terminates in front of this (Dokploy's Traefik), so it listens on plain 80.

# Pages revalidate on every visit, so a deploy shows up at once. The demo's build output is
# fingerprinted and never changes under the same name.
map $uri $cache_control {
  ~^/demo/assets/  "public, max-age=31536000, immutable";
  ~^/assets/       "public, max-age=86400";
  default          "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  # Behind a proxy: keep redirects (e.g. /demo → /demo/) relative, so they stay on https.
  absolute_redirect off;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
