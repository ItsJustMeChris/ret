# Builds the installer and publishes it, with the latest.yml feed electron-updater reads,
# as a GitHub Release. Installed copies pick it up on their next update check.
#
#   npm version patch   # bumps package.json and tags v<version>
#   git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      # electron-builder only builds: its own publisher uploads artifacts in parallel and can
      # race itself into several releases for one tag, splitting the files between them.
      - run: npm run dist -- --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --generate-notes \
            "release/Ret-Setup-$version.exe" \
            "release/Ret-Setup-$version.exe.blockmap" \
            release/latest.yml
